# Builds the Rivers command-line tool and node (one binary) for Linux and publishes it as a
# GitHub release, so servers can download it instead of compiling for hours.
name: Build Rivers

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "consensus/**"
      - "sui-execution/**"
      - "external-crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rivers-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rivers-build
  cancel-in-progress: true

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libpq-dev libssl-dev pkg-config protobuf-compiler build-essential

      - name: Build
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
          CARGO_PROFILE_RELEASE_STRIP: "symbols"
        run: cargo build --release --bin sui --bin sui-node --bin sui-bridge --bin sui-bridge-cli

      - name: Package
        run: |
          mkdir dist
          cp target/release/sui dist/rivers
          cp target/release/sui-node dist/rivers-node
          cp target/release/sui-bridge dist/rivers-bridge
          cp target/release/sui-bridge-cli dist/rivers-bridge-cli
          tar -C dist -czf rivers-linux-${{ matrix.arch }}.tar.gz rivers rivers-node rivers-bridge rivers-bridge-cli
          sha256sum rivers-linux-${{ matrix.arch }}.tar.gz > rivers-linux-${{ matrix.arch }}.tar.gz.sha256
          ls -lh rivers-linux-*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rivers-build-${{ github.run_number }}
          name: Rivers testnet build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Rivers node and command-line tool, built from ${{ github.sha }}.
            Servers set up with rivers-testnet/setup.sh download this build automatically.
          files: |
            rivers-linux-${{ matrix.arch }}.tar.gz
            rivers-linux-${{ matrix.arch }}.tar.gz.sha256
